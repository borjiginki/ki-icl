id: projects
description: >-
  What KI group is working on right now, one artifact per engagement: the goal,
  the scope, and the current stage and health with the date that assessment was
  made. Look here when the question is about a specific project's progress or
  content, rather than about how KI group runs projects in general. Always report
  the as-of date with the answer, because a status can be older than it looks.
