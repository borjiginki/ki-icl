description: >-
  A delivered reference engagement for RWE (Power & Utilities / Power Generation). A predictive-maintenance solution for RWE power plants - forecasting component downtimes from on-prem sensor data to cut seven-figure losses (>10% downtime reduction). Use as a comparable when discussing similar customers, sectors or problems.
