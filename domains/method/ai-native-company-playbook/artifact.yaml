title: AI-Native Company Playbook
kind: methodology
review: draft
sensitivity: internal
description: >-
  The strategic operating canon: what an AI-native company is, why the window
  to become one is now, the maturity ladder, the operating principles, and how
  to get there as an incumbent or a startup. Use when a question is about how
  KI group thinks about AI-native transformation, or when framing a client
  conversation around the same argument KI group sells from. Governs
  `offerings`: where an offering document and this playbook disagree, this
  playbook wins.
