name: Deploy

# Every push to main: build the image, plan the infrastructure, then pause for a human
# to approve before anything is actually applied. The image is rebuilt every time
# rather than only when server/ changes, so the image tag (the commit sha) always has
# something in ACR for terraform-plan to point at - ACR build layer-caches, so this is
# cheap even when nothing server-side changed.
#
# The corpus itself is no longer published from here. It moved to ki-ccl
# (github.com/ki-group-gmbh/ki-ccl), which publishes to the Files share on its own
# merges to main, from the self-hosted runner defined in deploy/runner.tf. See that
# repo's publish.yml and deploy/README.md's "Publishing" section.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Read by both the az CLI (via azure/login below) and Terraform's own azurerm
  # provider, which picks these up itself with no explicit configuration.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # The remote state backend's own auth, separate from the subscription credentials
  # above. See deploy/backend.hcl and deploy/versions.tf.
  ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"

      - name: Build and push
        id: build
        working-directory: deploy
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          ACR=$(terraform output -raw acr_name)
          SERVER=$(terraform output -raw acr_login_server)
          SHA=$(git rev-parse --short HEAD)
          az acr build --registry "$ACR" --image "ki-icl:$SHA" ..
          echo "image=$SERVER/ki-icl:$SHA" >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform plan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"

      - name: terraform plan
        working-directory: deploy
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          terraform plan -input=false -out=tfplan.binary \
            -var "image=${{ needs.build-and-push.outputs.image }}"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: deploy/tfplan.binary
          retention-days: 5

  terraform-apply:
    name: Terraform apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: azure-infra
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: deploy

      - name: terraform apply
        working-directory: deploy
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          terraform apply -input=false tfplan.binary
