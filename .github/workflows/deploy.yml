name: Deploy

# Every push to main: build the image, plan the infrastructure, then pause for a human
# to approve before anything is actually applied. The image is rebuilt every time
# rather than only when server/ changes, so the image tag (the commit sha) always has
# something in ACR for terraform-plan to point at - ACR build layer-caches, so this is
# cheap even when nothing server-side changed.
#
# The corpus itself is no longer published from here. It moved to ki-ccl
# (github.com/ki-group-gmbh/ki-ccl), which publishes to the Files share on its own
# merges to main, from the self-hosted runner defined in deploy/runner.tf. See that
# repo's publish.yml and deploy/README.md's "Publishing" section.
on:
  push:
    branches: [main]
  # Stage 2 of deploy/README.md turns the publish runner on by flipping the repository
  # variable PUBLISH_RUNNER_ENABLED, which is read at plan time rather than committed
  # anywhere. Without a manual trigger, acting on that flip would mean pushing an empty
  # commit to main just to make the pipeline re-read a variable that already changed.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Read by both the az CLI (via azure/login below) and Terraform's own azurerm
  # provider, which picks these up itself with no explicit configuration.
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # The remote state backend's own auth, separate from the subscription credentials
  # above. See deploy/backend.hcl and deploy/versions.tf.
  ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      runner_image: ${{ steps.build.outputs.runner_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6"

      - name: Build and push
        id: build
        working-directory: deploy
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          ACR=$(terraform output -raw acr_name)
          SERVER=$(terraform output -raw acr_login_server)
          SHA=$(git rev-parse --short HEAD)
          az acr build --registry "$ACR" --image "ki-icl:$SHA" ..
          echo "image=$SERVER/ki-icl:$SHA" >> "$GITHUB_OUTPUT"

          # The publish runner's image, built here for the same two reasons the server's
          # is: layer caching makes it nearly free when deploy/runner/ has not changed,
          # and the tag terraform is about to reference has to exist in ACR before the
          # plan can point at it. Building it is not the same as creating the runner -
          # that is PUBLISH_RUNNER_ENABLED's job, in terraform-plan below.
          az acr build --registry "$ACR" --image "ki-ccl-runner:$SHA" runner
          echo "runner_image=$SERVER/ki-ccl-runner:$SHA" >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform plan
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6"

      # The allow-list is a secret rather than a variable for one reason: ki-icl is a
      # public repository, so these logs are world-readable, and an allow-list entry
      # pairs a named colleague with their home IP - personal data, which does not
      # belong in a public log any more than in a public file. GitHub masks a secret
      # only where it appears verbatim, and terraform prints name, cidr and description
      # on separate lines, so each field is registered on its own here, before the step
      # that can print any of them runs.
      - name: Mask the allow-list before anything can print it
        env:
          ALLOWED_CLIENT_CIDRS: ${{ secrets.ALLOWED_CLIENT_CIDRS }}
        run: |
          set -euo pipefail
          [ -n "${ALLOWED_CLIENT_CIDRS:-}" ] || exit 0
          jq -r '.[] | .cidr, (.cidr | split("/")[0]), .name, (.description // empty)' \
            <<<"$ALLOWED_CLIENT_CIDRS" |
            while IFS= read -r value; do
              [ -n "$value" ] && echo "::add-mask::$value"
            done

      # Every -var here is resolved on every plan, whether or not this run means to
      # change it, because terraform reconciles against what the run declares rather
      # than against what an earlier one left behind. That cuts both ways:
      #
      # runner_image omitted reads as "destroy the runner", which is what would happen
      # to a runner stood up by a one-off local apply. Making the switch a repository
      # variable keeps the whole lifecycle in this pipeline: unset or anything but
      # "true" means no runner, and no runner is the honest state until the Key Vault
      # PAT and the runner identity's three role assignments exist. See
      # deploy/README.md, "Stage 2: the publish runner".
      #
      # The two ingress variables are here for the same reason, learned the harder way.
      # They used to be a deliberate local-only override, on the theory that CI had no
      # business opening the app to the internet. What that actually bought was every
      # merge to main silently revoking an allow-list a human had applied by hand, with
      # the revocation visible only as two lines in a plan nobody reads closely - and
      # the app is reachable from outside kiicl-vnet by no other route, so the first
      # symptom is the MCP client dying. Declaring them from repository settings means
      # the plan says what is true, and the values still never enter this repository.
      #
      # dashboard_enabled joins them for the same reason, and carries max_replicas with
      # it because the dashboard's own precondition requires a single replica.
      - name: terraform plan
        working-directory: deploy
        env:
          ALLOWED_CLIENT_CIDRS: ${{ secrets.ALLOWED_CLIENT_CIDRS }}
        run: |
          set -euo pipefail
          runner_image=""
          if [ "${{ vars.PUBLISH_RUNNER_ENABLED }}" = "true" ]; then
            runner_image="${{ needs.build-and-push.outputs.runner_image }}"
          fi
          external_ingress=false
          if [ "${{ vars.EXTERNAL_INGRESS_ENABLED }}" = "true" ]; then
            external_ingress=true
          fi
          dashboard=false
          # The dashboard reads a usage file each replica writes for itself, so above
          # one replica the page shows a partial picture. variables.tf makes that a hard
          # precondition, and this array is what satisfies it.
          replicas=()
          if [ "${{ vars.DASHBOARD_ENABLED }}" = "true" ]; then
            dashboard=true
            replicas=(-var "max_replicas=1")
          fi
          # Empty means no rule at all, which with external_ingress_enabled = true
          # lifts the IP restriction rather than closing it: Container Apps is
          # deny-by-default only once an Allow rule exists. So an unset, emptied or
          # rotated-away secret opens the app to everyone. See variables.tf. With the
          # dashboard on that is an unauthenticated corpus index on the internet, which
          # a precondition refuses, so the plan fails here rather than the apply
          # succeeding.
          allowed_cidrs="${ALLOWED_CLIENT_CIDRS:-[]}"
          terraform init -backend-config=backend.hcl -input=false
          terraform plan -input=false -out=tfplan.binary \
            -var "image=${{ needs.build-and-push.outputs.image }}" \
            -var "runner_image=$runner_image" \
            -var "external_ingress_enabled=$external_ingress" \
            -var "allowed_client_cidrs=$allowed_cidrs" \
            -var "dashboard_enabled=$dashboard" \
            ${replicas[@]+"${replicas[@]}"}

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: deploy/tfplan.binary
          retention-days: 5

  terraform-apply:
    name: Terraform apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: azure-infra
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: deploy

      - name: terraform apply
        working-directory: deploy
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl -input=false
          terraform apply -input=false tfplan.binary
